  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image: var(--wallpaper);
    background-size: 420px auto;
    background-repeat: repeat;
    background-position: top center;
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  .h { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .veil { background: rgba(244,241,232,0.92); border-radius: 14px; padding: 16px; }
  .pill {
    border: 1px solid rgba(36,49,63,0.25); border-radius: 999px;
    padding: 9px 15px; font-size: 14px; cursor: pointer;
    background: var(--card); white-space: nowrap;
    -webkit-user-select: none; user-select: none;
  }
  .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .field {
    border: 1px solid rgba(36,49,63,0.25); border-radius: 8px;
    padding: 11px 12px; font-size: 16px;
    font-family: 'Inter', sans-serif; width: 100%;
    background: var(--card); color: var(--ink);
  }
  .card {
    background: var(--card); border: 1px solid rgba(36,49,63,0.15);
    border-radius: 12px; overflow: hidden; display: flex;
  }
  .stub {
    flex: 0 0 58px; background: var(--ink); color: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 12px 4px;
  }
  .card ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.65; }
  .maps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(36,49,63,0.12); }
  .maps a {
    font-size: 12px; text-decoration: none; color: var(--ink);
    border: 1px solid rgba(36,49,63,0.22); border-radius: 999px;
    padding: 5px 11px; background: rgba(255,255,255,0.7);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .maps a:hover { border-color: var(--ink); }
  .maps a::after { content: '\2197'; opacity: 0.5; font-size: 11px; }
  .maps-label { font-size: 11px; opacity: 0.55; width: 100%; margin-bottom: -2px; }
  .stay { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(36,49,63,0.12); }
  .stay-name { font-size: 13px; font-weight: 500; }
  .stay-note { font-size: 12px; opacity: 0.7; margin-top: 3px; line-height: 1.5; }
  .stay-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stay-links a {
    font-size: 12px; text-decoration: none; color: var(--ink);
    border: 1px solid rgba(36,49,63,0.22); border-radius: 999px;
    padding: 5px 11px; background: rgba(255,255,255,0.7);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .stay-links a:hover { border-color: var(--ink); }
  .stay-links a::after { content: '\2197'; opacity: 0.5; font-size: 11px; }
  .card li { margin-bottom: 3px; }
  .btn {
    border: 1px solid var(--ink); border-radius: 8px; padding: 11px 16px;
    font-size: 14px; background: var(--ink); color: var(--paper);
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 520px) {
    .card { flex-direction: column; }
    .stub { flex: none; flex-direction: row; gap: 10px; justify-content: flex-start; padding: 8px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div style="margin-bottom:16px; padding:4px 2px;">
    <div class="h" style="font-size:26px; line-height:1.2;">Normandy &amp; Brittany</div>
    <div class="mono" style="font-size:12px; opacity:0.7; margin-top:4px;">17–27 September 2026</div>
  </div>

  <div class="row" style="margin-bottom:10px; overflow-x:auto; flex-wrap:nowrap; padding-bottom:4px;">
    <div class="pill" data-base="Vernon">Vernon</div>
    <div class="pill" data-base="Caen">Caen</div>
    <div class="pill" data-base="Cherrueix">Cherrueix</div>
    <div class="pill" data-base="Paris">Paris</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
    <select id="daySelect" class="field"><option value="all">All days</option></select>
    <input id="searchBox" class="field" placeholder="Search a place or activity">
  </div>

  <div id="dayList" style="display:flex; flex-direction:column; gap:12px;"></div>

  <div id="emptyState" class="veil" style="display:none; text-align:center; font-size:14px;">
    Nothing matches those filters. <span id="clearLink" style="text-decoration:underline; cursor:pointer;">Clear filters</span>
  </div>

</div>

<script>
var days = [
  { day:1, date:"Thu 17/09", base:"Vernon", title:"Arrival → Vernon area",
    items:["Arrive CDG 20:35, pick up rental car","Drive ~1h15 to Vernon area","Late check-in, rest"],
    locations:["CDG","Vernon"] },
  { day:2, date:"Fri 18/09", base:"Caen", title:"Giverny → Rouen → Caen",
    items:["Monet's House & Gardens, Giverny","Rouen: lunch, Notre-Dame Cathedral, Gros-Horloge, old town","Abbaye de Jumièges (short detour)","Evening check-in, explore Caen old town and château"],
    locations:["Giverny","Rouen","Abbaye de Jumièges","Caen"] },
  { day:3, date:"Sat 19/09", base:"Caen", title:"Cheese, cider & coast loop",
    items:["Manoir de Grandouet (near Cambremer) — cider, Pommeau, Calvados, own AOP Camembert","Optional: Calvados Pierre Huet or Calvados Dupont","Beuvron-en-Auge — coffee or lunch stop","Honfleur — old harbour","Deauville — beach, Planches boardwalk","Trouville-sur-Mer — seafront + Saturday seafood market"],
    locations:["Manoir de Grandouet","Cambremer","Beuvron-en-Auge","Honfleur","Deauville","Trouville-sur-Mer"] },
  { day:4, date:"Sun 20/09", base:"Caen", title:"Zipline + Bagnoles-de-l'Orne",
    items:["Morning: Skypark Normandie (AJ Hackett) — zip line, swing, bungee","Afternoon: Bagnoles-de-l'Orne-Normandie — lake walk, pedalo, spa town"],
    locations:["Skypark Normandie","Souleuvre Viaduct","Bagnoles-de-l'Orne"] },
  { day:5, date:"Mon 21/09", base:"Cherrueix", title:"D-Day beaches → Cherrueix",
    items:["Omaha Beach","Caramels d'Isigny, Isigny-sur-Mer — factory runs weekday mornings, go early to catch the live line","Pointe du Hoc","Checkout, drive to Cherrueix, check in"],
    locations:["Omaha Beach","Caramels d'Isigny Isigny-sur-Mer","Pointe du Hoc","Cherrueix"] },
  { day:6, date:"Tue 22/09", base:"Cherrueix", title:"Saint-Malo market, Cancale & sunset",
    items:["Saint-Malo Intra-Muros market (Tue/Fri only)","Cancale — oyster lunch","Evening: Saint-Malo ramparts, sunset walk"],
    locations:["Saint-Malo","Cancale"] },
  { day:7, date:"Wed 23/09", base:"Cherrueix", title:"Mont-Saint-Michel & Dol-de-Bretagne",
    items:["Mont-Saint-Michel — unhurried, 2–3 hours","Dol-de-Bretagne — cathedral, old town"],
    locations:["Mont-Saint-Michel","Dol-de-Bretagne"] },
  { day:8, date:"Thu 24/09", base:"Cherrueix", title:"Dinan + optional add-on",
    items:["Dinan — old town, Rue du Jerzual, ramparts, port","Optional add-ons (choose on the day):","• Léhon — quick, riverside, ruined abbey","• Combourg — moated château, lake & forest","• Dinard — Belle-Époque seaside town"],
    locations:["Dinan","Léhon","Combourg","Dinard"] },
  { day:9, date:"Fri 25/09", base:"Paris", title:"Cherrueix → Paris (early departure)",
    items:["Depart Cherrueix first thing","Brunch stop: Le Mans (or Fougères for something quicker and earlier)","CDG — return rental car by 14:00","Check in Hôtel André Latin, evening free in Paris"],
    locations:["Le Mans","Fougères","CDG","Paris"] },
  { day:10, date:"Sat 26/09", base:"Paris", title:"Paris (full day)",
    items:["Full day in Paris — not yet planned","Evening: transfer to CDG for 23:20 flight"],
    locations:["Paris","CDG"] }
];

var stays = {"1": {"name": "Vernon: La Marinière — check-in from 16:00, out 11:00", "book": "https://www.airbnb.com/rooms/559409686750888926", "maps": "https://www.google.com/maps/search/?api=1&query=La%20Marini%C3%A8re%2C%20Vernon%2C%20France"}, "2": {"name": "Caen — maison type loft", "book": "https://www.airbnb.com/l/QryEmF4g", "maps": ""}, "5": {"name": "A Fleur d'Océan, Cherrueix", "book": "https://www.airbnb.com/rooms/1350685159499744078", "maps": "https://www.google.com/maps/search/?api=1&query=48.6059012%2C-1.7112233"}, "9": {"name": "Hôtel André Latin, Paris — 25–26 Sep", "book": "", "maps": "https://www.google.com/maps/search/?api=1&query=H%C3%B4tel%20Andr%C3%A9%20Latin%2C%2050%20Rue%20Gay-Lussac%2C%2075005%20Paris"}, "3": {"name": "Caen — maison type loft", "book": "https://www.airbnb.com/l/QryEmF4g", "maps": ""}, "4": {"name": "Caen — maison type loft", "book": "https://www.airbnb.com/l/QryEmF4g", "maps": ""}, "6": {"name": "A Fleur d'Océan, Cherrueix", "book": "https://www.airbnb.com/rooms/1350685159499744078", "maps": "https://www.google.com/maps/search/?api=1&query=48.6059012%2C-1.7112233"}, "7": {"name": "A Fleur d'Océan, Cherrueix", "book": "https://www.airbnb.com/rooms/1350685159499744078", "maps": "https://www.google.com/maps/search/?api=1&query=48.6059012%2C-1.7112233"}, "8": {"name": "A Fleur d'Océan, Cherrueix", "book": "https://www.airbnb.com/rooms/1350685159499744078", "maps": "https://www.google.com/maps/search/?api=1&query=48.6059012%2C-1.7112233"}};

var activeBases = {};
var daySelect = document.getElementById('daySelect');
var listEl = document.getElementById('dayList');
var emptyEl = document.getElementById('emptyState');

days.forEach(function(d){
  var o = document.createElement('option');
  o.value = d.day;
  o.textContent = 'Day ' + d.day + ' — ' + d.date;
  daySelect.appendChild(o);
});

function anyBase(){ for (var k in activeBases) if (activeBases[k]) return true; return false; }

function render(){
  var dayFilter = daySelect.value;
  var q = document.getElementById('searchBox').value.trim().toLowerCase();
  listEl.innerHTML = '';
  var shown = 0;

  days.forEach(function(d){
    if (dayFilter !== 'all' && String(d.day) !== dayFilter) return;
    if (anyBase() && !activeBases[d.base]) return;
    if (q) {
      var hay = (d.title + ' ' + d.items.join(' ') + ' ' + d.locations.join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }
    shown++;

    var card = document.createElement('div');
    card.className = 'card';

    var stub = document.createElement('div');
    stub.className = 'stub';
    stub.innerHTML = '<div class="mono" style="font-size:19px;">' + (d.day < 10 ? '0' + d.day : d.day) + '</div>' +
                     '<div class="mono" style="font-size:11px; opacity:0.85;">' + d.date + '</div>';

    var body = document.createElement('div');
    body.style.cssText = 'padding:14px 16px; flex:1; min-width:0;';

    var head = document.createElement('div');
    head.style.cssText = 'display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px;';
    var t = document.createElement('div');
    t.className = 'h'; t.style.fontSize = '16px'; t.textContent = d.title;
    var b = document.createElement('div');
    b.className = 'mono'; b.style.cssText = 'font-size:11px; opacity:0.65;'; b.textContent = d.base;
    head.appendChild(t); head.appendChild(b);

    var ul = document.createElement('ul');
    d.items.forEach(function(it){
      var li = document.createElement('li');
      li.textContent = it;
      ul.appendChild(li);
    });

    var maps = document.createElement('div');
    maps.className = 'maps';
    var lab = document.createElement('div');
    lab.className = 'maps-label';
    lab.textContent = 'Open in Maps';
    maps.appendChild(lab);
    d.locations.forEach(function(loc){
      var a = document.createElement('a');
      a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc + ', France');
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = loc;
      maps.appendChild(a);
    });

    body.appendChild(head); body.appendChild(ul); body.appendChild(maps);

    var st = stays[d.day];
    if (st) {
      var sw = document.createElement('div');
      sw.className = 'stay';
      var sl = document.createElement('div');
      sl.className = 'maps-label';
      sl.textContent = 'Staying at';
      var sn = document.createElement('div');
      sn.className = 'stay-name';
      sn.textContent = st.name;
      sw.appendChild(sl); sw.appendChild(sn);
      if (st.note) {
        var no = document.createElement('div');
        no.className = 'stay-note';
        no.textContent = st.note;
        sw.appendChild(no);
      }
      var lk = document.createElement('div');
      lk.className = 'stay-links';
      if (st.book) {
        var ab = document.createElement('a');
        ab.href = st.book; ab.target = '_blank'; ab.rel = 'noopener';
        ab.textContent = 'Reservation';
        lk.appendChild(ab);
      }
      if (st.maps) {
        var am = document.createElement('a');
        am.href = st.maps; am.target = '_blank'; am.rel = 'noopener';
        am.textContent = 'Directions';
        lk.appendChild(am);
      }
      if (lk.children.length) sw.appendChild(lk);
      body.appendChild(sw);
    }
    card.appendChild(stub); card.appendChild(body);
    listEl.appendChild(card);
  });

  emptyEl.style.display = shown === 0 ? 'block' : 'none';
  listEl.style.display  = shown === 0 ? 'none' : 'flex';
}

Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(el){
  el.addEventListener('click', function(){
    var b = el.getAttribute('data-base');
    activeBases[b] = !activeBases[b];
    el.classList.toggle('active', !!activeBases[b]);
    render();
  });
});

daySelect.addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('clearLink').addEventListener('click', function(){
  activeBases = {};
  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(el){ el.classList.remove('active'); });
  daySelect.value = 'all';
  document.getElementById('searchBox').value = '';
  render();
});

render();

</script>
</body>
</html>
